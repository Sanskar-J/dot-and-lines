name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Use 22.04. ubuntu-latest (24.04) has broken python-for-android cross-compilation
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    
    - name: Set up Python
      uses: actions/setup-python@v5.2.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Cython 0.29.33 is strictly required for stable Kivy cross-compilation
        pip install buildozer Cython==0.29.33 virtualenv
        pip install kivy
    
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          python3-pip \
          openjdk-17-jdk \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          cmake \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5

    - name: Build APK
      run: |
        buildozer -v android debug
    
    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4.4.0
      with:
        name: apk-artifact
        path: bin/*.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}